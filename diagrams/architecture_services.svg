<text x="40" y="1302" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172a44" text-anchor="start">
<tspan x="40" dy="0">Приём событий Go пишет в Kafka. Индексаторы, фото, DWH и обучение показаны отдельно.</tspan>
</text>
<text x="40" y="1335" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526277" text-anchor="start">
