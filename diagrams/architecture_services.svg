<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1370" viewBox="0 0 1400 1370" role="img" aria-labelledby="title desc">
<title id="title">Сервисы и доступ к данным</title><desc id="desc">Логические сервисы и их ресурсы. Межсервисная композиция использует API объявлений. Повторённые названия Redis и PostgreSQL main обозначают соответствующие логические данные, а не отдельные обязательные инсталляции.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#334155"/></marker><marker id="event" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#7c3aed"/></marker></defs>
<rect width="1400" height="1370" fill="white"/>
<text x="36" y="44" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="36" dy="0">Сервисы и доступ к данным</tspan>
</text>
<text x="36" y="79" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526277" text-anchor="start">
<tspan x="36" dy="0">Вход: NGINX. Внутри: Kubernetes Service / gRPC. Справа указаны только разрешённые ресурсы.</tspan>
</text>
