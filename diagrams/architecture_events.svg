<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1460" viewBox="0 0 1480 1460" role="img" aria-labelledby="title desc">
<title id="title">События и фоновые задачи</title><desc id="desc">Потоки ad-changes, rec-events, message-delivery и CDC, независимые потребители, их результаты и периодическое обучение. Пунктиром обозначена передача событий, сплошными стрелками запись результата или чтение данных.</desc>
