<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">Внешний вход и балансировка</title><desc id="desc">Клиент разрешает DNS, читает статику через CDN и отправляет динамические запросы в выбранный дата-центр через VIP, IPVS и NGINX. Загрузка фото обходит CDN-кэш.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#334155"/></marker><marker id="event" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#7c3aed"/></marker></defs>
<rect width="1200" height="930" fill="white"/>
<text x="36" y="44" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="36" dy="0">Внешний вход и балансировка</tspan>
</text>
<text x="36" y="78" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526277" text-anchor="start">
<tspan x="36" dy="0">ДЦ: Москва / Екатеринбург / Новосибирск. Реплики и резерв показаны в разделе 10.</tspan>
</text>
<rect x="35" y="120" width="280" height="110" rx="8" fill="#f1f5f9" stroke="#8291a5" stroke-width="1.6"/>
<text x="53" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="53" dy="0">PowerDNS</tspan>
</text>
<text x="53" y="181" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172a44" text-anchor="start">
<tspan x="53" dy="0">IP здорового ДЦ</tspan>
<tspan x="53" dy="25.56">Штатные веса 55 / 25 / 20</tspan>
</text>
<rect x="455" y="120" width="290" height="110" rx="8" fill="#f1f5f9" stroke="#8291a5" stroke-width="1.6"/>
<text x="473" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="473" dy="0">Браузер / приложение</tspan>
</text>
<text x="473" y="181" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172a44" text-anchor="start">
<tspan x="473" dy="0">HTTPS / JSON · WSS</tspan>
</text>
<rect x="885" y="120" width="280" height="110" rx="8" fill="#f1f5f9" stroke="#8291a5" stroke-width="1.6"/>
<text x="903" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="903" dy="0">CDN / Anycast media</tspan>
</text>
<text x="903" y="181" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172a44" text-anchor="start">
<tspan x="903" dy="0">Статика и чтение фото</tspan>
<tspan x="903" dy="25.56">Cache hit: ответ из CDN</tspan>
</text>
<polyline points="455,157 315,157" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="385" y="145" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">
<tspan x="385" dy="0">DNS</tspan>
</text>
<polyline points="745,157 885,157" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="815" y="145" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">
<tspan x="815" dy="0">GET</tspan>
</text>
<rect x="25" y="330" width="1150" height="505" rx="10" fill="#fbfcfe" stroke="#a8b6c8" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="45" y="363" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="45" dy="0">Выбранный здоровый дата-центр</tspan>
</text>
<rect x="455" y="395" width="290" height="95" rx="8" fill="#edf5ff" stroke="#4d82bf" stroke-width="1.6"/>
<text x="473" y="425" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="473" dy="0">VIP / IPVS</tspan>
</text>
<text x="473" y="456" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172a44" text-anchor="start">
<tspan x="473" dy="0">Keepalived · L3/L4</tspan>
</text>
<polyline points="600,230 600,395" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="715" y="288" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">
<tspan x="715" dy="0">API / HTML / WSS</tspan>
</text>
<polyline points="1025,230 1025,300 710,300 710,395" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="885" y="285" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">
<tspan x="885" dy="0">Cache miss → origin</tspan>
</text>
<rect x="455" y="545" width="290" height="95" rx="8" fill="#edf5ff" stroke="#4d82bf" stroke-width="1.6"/>
<text x="473" y="575" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="473" dy="0">NGINX · L7</tspan>
</text>
<text x="473" y="606" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172a44" text-anchor="start">
<tspan x="473" dy="0">TLS · домен / путь</tspan>
</text>
<polyline points="600,490 600,545" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="650" y="525" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">
<tspan x="650" dy="0">TCP</tspan>
</text>
<rect x="55" y="710" width="310" height="95" rx="8" fill="#edf5ff" stroke="#4d82bf" stroke-width="1.6"/>
<text x="73" y="740" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="73" dy="0">Next.js</tspan>
</text>
<text x="73" y="771" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172a44" text-anchor="start">
<tspan x="73" dy="0">Динамический HTML</tspan>
</text>
<rect x="445" y="710" width="310" height="95" rx="8" fill="#edf5ff" stroke="#4d82bf" stroke-width="1.6"/>
<text x="463" y="740" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="463" dy="0">Сервисы Go</tspan>
</text>
<text x="463" y="771" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172a44" text-anchor="start">
<tspan x="463" dy="0">API · чат / WS · события</tspan>
</text>
<rect x="835" y="710" width="310" height="95" rx="8" fill="#fff6e8" stroke="#c69040" stroke-width="1.6"/>
<text x="853" y="740" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172a44" text-anchor="start">
<tspan x="853" dy="0">Ceph S3 origin</tspan>
</text>
<text x="853" y="771" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172a44" text-anchor="start">
<tspan x="853" dy="0">Фото по presigned URL</tspan>
</text>
<polyline points="520,640 520,670 210,670 210,710" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="300" y="695" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">
<tspan x="300" dy="0">www</tspan>
</text>
<polyline points="600,640 600,710" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="690" y="699" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">
<tspan x="690" dy="0">api / chat / events</tspan>
</text>
<polyline points="680,640 680,670 990,670 990,710" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="910" y="695" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">
<tspan x="910" dy="0">media</tspan>
</text>
<text x="40" y="875" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172a44" text-anchor="start">
<tspan x="40" dy="0">Загрузка оригинала: API выдаёт URL, клиент делает PUT в S3 origin без CDN-кэша.</tspan>
</text>
<text x="40" y="906" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526277" text-anchor="start">
<tspan x="40" dy="0">Дальнейшие связи Go-сервисов показаны на следующем рисунке.</tspan>
